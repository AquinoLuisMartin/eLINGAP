server {
    listen 80;
    server_name elingap.example.org;
    return 301 https://elingap.example.org$request_uri;
}

server {
    listen 443 ssl;
    server_name elingap.example.org;
    root /var/www/elingap/current/public;
    index index.php;

    ssl_certificate /etc/letsencrypt/live/elingap.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elingap.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 32m;
    keepalive_timeout 30;
    access_log /var/log/nginx/elingap-access.log elingap_metrics;
    error_log /var/log/nginx/elingap-error.log warn;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /build/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.php {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/elingap.sock;
        fastcgi_read_timeout 95s;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}
