[program:elingap-worker]
command=/usr/bin/php -d memory_limit=512M /var/www/elingap/current/artisan queue:work database-atomic --queue=default --sleep=5 --tries=3 --timeout=60 --memory=256 --max-jobs=500 --max-time=3600
directory=/var/www/elingap/current
user=www-data
numprocs=1
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stopwaitsecs=90
redirect_stderr=true
stdout_logfile=/var/www/elingap/shared/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
